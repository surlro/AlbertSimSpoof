name: Build AlbertSimSpoof

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y fakeroot zstd curl git

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Download iOS SDK
        run: |
          curl -sSL -o sdk.tar.zst \
            "https://github.com/theos/sdks/releases/download/2024-09-18/iPhoneOS16.5.sdk.tar.zst"
          zstd -d sdk.tar.zst -o sdk.tar
          tar -xf sdk.tar -C /opt/theos/sdks/
          rm sdk.tar.zst sdk.tar

      - name: Build
        run: |
          export THEOS=/opt/theos
          export THEOS_MAKE_PATH=/opt/theos/makefiles
          make package FINALPACKAGE=1 2>&1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AlbertSimSpoof-dylib
          path: |
            .theos/obj/debug/arm64/AlbertSimSpoof.dylib
            .theos/obj/debug/arm64e/AlbertSimSpoof.dylib
            layout/Library/MobileSubstrate/DynamicLibraries/AlbertSimSpoof.plist

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AlbertSimSpoof-deb
          path: packages/*.deb
          if-no-files-found: warn
