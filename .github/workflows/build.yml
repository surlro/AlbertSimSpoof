name: Build AlbertSimSpoof

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y fakeroot curl git xz-utils

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p /opt/theos/sdks
          curl -sSL -o /tmp/sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf /tmp/sdk.tar.xz -C /opt/theos/sdks/

      - name: Download clang toolchain
        run: |
          curl -sSL -o /tmp/toolchain.tar.xz \
            "https://github.com/theos/toolchain/releases/download/linux-12.0.0/linux-12.0.0.tar.xz"
          mkdir -p /opt/theos/toolchain/linux/iphone
          tar -xJf /tmp/toolchain.tar.xz -C /opt/theos/toolchain/linux/iphone/ --strip-components=1

      - name: Build
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1 2>&1

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AlbertSimSpoof-dylib
          path: |
            .theos/obj/debug/arm64/AlbertSimSpoof.dylib
            .theos/obj/debug/arm64e/AlbertSimSpoof.dylib
            layout/Library/MobileSubstrate/DynamicLibraries/AlbertSimSpoof.plist

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AlbertSimSpoof-deb
          path: packages/*.deb
          if-no-files-found: warn
